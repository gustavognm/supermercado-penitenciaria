<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Novo Pedido')}"></head>
<body>
<nav th:replace="~{fragments/head :: header()}"></nav>

<div class="container">
  <div class="card" style="max-width: 560px; margin: 0 auto;">
    <h2 class="page-title" style="margin-top:0">Novo Pedido</h2>

    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <form th:action="@{/pedido/save}" th:object="${pedido}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

      <div class="form-group">
        <label for="cliente">Cliente</label>
        <select id="cliente" name="cliente.id" class="form-control" required>
          <option value="">-- Selecione --</option>
          <option th:each="c : ${clientes}"
                  th:value="${c.id}"
                  th:text="${c.nome}"
                  th:selected="${pedido.cliente != null && pedido.cliente.id == c.id}">
          </option>
        </select>
      </div>

      <div class="form-group">
        <label for="detento">Detento</label>
        <select id="detento" name="detento.id" class="form-control" required>
          <option value="">-- Selecione --</option>
          <option th:each="d : ${detentos}"
                  th:value="${d.id}"
                  th:text="${d.nome} + ' - ' + ${d.tipoLocalizacao.label} + ' ' + ${d.identificadorLocalizacao} + ', Cela ' + ${d.numeroCela}"
                  th:selected="${pedido.detento != null && pedido.detento.id == d.id}">
          </option>
        </select>
      </div>

      <div class="form-group">
        <label for="observacao">Observação (opcional)</label>
        <textarea id="observacao" th:field="*{observacao}" class="form-control" rows="3"
                  placeholder="Ex: cliente pediu para priorizar, confirmar horário de visita, etc."></textarea>
      </div>

      <p style="color: var(--text-s); font-size: 0.9rem;">
        O pedido será criado com status <strong>Em Montagem</strong>. A adição de produtos
        será feita na próxima etapa, na tela de detalhes do pedido.
      </p>

      <div style="display:flex; gap:10px; margin-top:8px;">
        <button type="submit" class="btn btn-primary">Criar Pedido</button>
        <a th:href="@{/pedido}" class="btn btn-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>

<footer th:replace="~{fragments/footer :: footer()}"></footer>
</body>
</html>
