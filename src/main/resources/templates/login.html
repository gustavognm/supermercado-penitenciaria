<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Supermercado dos Operários</title>
  <link rel="stylesheet" th:href="@{/css/custom.css}" />
  <link rel="stylesheet" th:href="@{/css/login.css}" />
</head>
<body class="login-body">

  <img th:src="@{/images/logo.png}" alt="Supermercado dos Operários" class="login-page-logo" />

  <div class="card login-card" style="max-width: 380px; width: 100%; margin-bottom: 0;">
    <div class="login-title">Bem-vindo de volta</div>
    <div class="login-sub">Faça login para acessar o sistema</div>

    <div th:if="${param.error}" class="alert alert-danger">E-mail ou senha inválidos.</div>
    <div th:if="${param.logout}" class="alert alert-success">Você saiu do sistema.</div>

    <form th:action="@{/login}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" class="form-control"
               placeholder="email@exemplo.com" required autofocus />
      </div>

      <div class="form-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" class="form-control"
               placeholder="••••••••" required />
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%; margin-top:8px; justify-content:center;">Entrar</button>
    </form>
  </div>

</body>
</html>
