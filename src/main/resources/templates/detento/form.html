<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Detento')}"></head>
<body>
<nav th:replace="~{fragments/head :: header()}"></nav>

<div class="container">
  <div class="card" style="max-width: 560px; margin: 0 auto;">
    <h2 class="page-title" style="margin-top:0"
        th:text="${detento.id != null} ? 'Editar Detento' : 'Novo Detento'"></h2>

    <form th:action="@{/detento/save}" th:object="${detento}" method="post">
      <input type="hidden" th:field="*{id}" />
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

      <div class="form-group">
        <label for="nome">Nome</label>
        <input type="text" id="nome" th:field="*{nome}" class="form-control"
               placeholder="Nome completo" />
        <span class="text-danger" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>
      </div>

      <div class="form-group">
        <label for="codigoInfopen">Código Infopen</label>
        <input type="text" id="codigoInfopen" th:field="*{codigoInfopen}" class="form-control"
               placeholder="Código de identificação Infopen" />
        <span class="text-danger" th:if="${#fields.hasErrors('codigoInfopen')}" th:errors="*{codigoInfopen}"></span>
      </div>

      <div class="form-group">
        <label for="tipoLocalizacao">Tipo de Localização</label>
        <select id="tipoLocalizacao" th:field="*{tipoLocalizacao}" class="form-control">
          <option value="">-- Selecione --</option>
          <option th:each="tipo : ${tiposLocalizacao}" th:value="${tipo}" th:text="${tipo.label}"></option>
        </select>
        <span class="text-danger" th:if="${#fields.hasErrors('tipoLocalizacao')}" th:errors="*{tipoLocalizacao}"></span>
      </div>

      <div class="form-group">
        <label for="identificadorLocalizacao">Identificador (Ala/Pavilhão)</label>
        <input type="text" id="identificadorLocalizacao" th:field="*{identificadorLocalizacao}" class="form-control"
               placeholder="Ex: 3" />
        <span class="text-danger" th:if="${#fields.hasErrors('identificadorLocalizacao')}" th:errors="*{identificadorLocalizacao}"></span>
      </div>

      <div class="form-group">
        <label for="numeroCela">Número da Cela</label>
        <input type="text" id="numeroCela" th:field="*{numeroCela}" class="form-control"
               placeholder="Ex: 12" />
        <span class="text-danger" th:if="${#fields.hasErrors('numeroCela')}" th:errors="*{numeroCela}"></span>
      </div>

      <div style="display:flex; gap:10px; margin-top:8px;">
        <button type="submit" class="btn btn-primary">Salvar</button>
        <a th:href="@{/detento}" class="btn btn-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>

<footer th:replace="~{fragments/footer :: footer()}"></footer>
</body>
</html>
