<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <th:block th:replace="~{fragments/head :: head('Página Inicial')}"></th:block>
  <body>
    <nav th:replace="~{fragments/head :: header()}"></nav>
    <div class="container">
      <div class="welcome-banner">
        <div>
          <h1>Bem-vindo(a)</h1>
          <p>Sistema de gestão de pedidos para clientes de unidades penitenciárias.</p>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-card stat-card-bark">
          <div class="stat-icon">
            <svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"></rect><rect x="9" y="1.3" width="6" height="3" rx="1"></rect><line x1="8" y1="9.5" x2="16" y2="9.5"></line><line x1="8" y1="13" x2="16" y2="13"></line><line x1="8" y1="16.5" x2="13" y2="16.5"></line></svg>
          </div>
          <div class="stat-body">
            <span class="stat-label">Pedidos em Andamento</span>
            <span class="stat-value" th:text="${totalPedidosAtivos}"></span>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-icon">
            <svg viewBox="0 0 24 24"><path d="M12 21s7-7.5 7-12a7 7 0 1 0-14 0c0 4.5 7 12 7 12z"></path><circle cx="12" cy="9" r="2.5"></circle></svg>
          </div>
          <div class="stat-body">
            <span class="stat-label">Em Andamento — Alas</span>
            <span class="stat-value" th:text="${totalAlas}"></span>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-icon">
            <svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="1"></rect><line x1="5" y1="9" x2="19" y2="9"></line><line x1="5" y1="14" x2="19" y2="14"></line><line x1="10" y1="3" x2="10" y2="21"></line></svg>
          </div>
          <div class="stat-body">
            <span class="stat-label">Em Andamento — Pavilhões</span>
            <span class="stat-value" th:text="${totalPavilhoes}"></span>
          </div>
        </div>

        <div class="stat-card stat-card-amber">
          <div class="stat-icon">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><polyline points="12 7 12 12 16 14"></polyline></svg>
          </div>
          <div class="stat-body">
            <span class="stat-label">Aguardando Entrega</span>
            <span class="stat-value" th:text="${totalAguardandoEntrega}"></span>
          </div>
        </div>
      </div>

      <div style="display:flex; gap:8px;">
        <a th:href="@{/pedido}" class="btn btn-secondary btn-sm">Ver Pedidos em Andamento</a>
      </div>
    </div>
    <footer th:replace="~{fragments/footer :: footer()}"></footer>
  </body>
</html>
