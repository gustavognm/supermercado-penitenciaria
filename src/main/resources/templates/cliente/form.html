<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Cliente')}"></head>
<body>
<nav th:replace="~{fragments/head :: header()}"></nav>

<div class="container">
  <div class="card" style="max-width: 560px; margin: 0 auto;">
    <h2 class="page-title" style="margin-top:0"
        th:text="${cliente.id != null} ? 'Editar Cliente' : 'Novo Cliente'"></h2>

    <form th:action="@{/cliente/save}" th:object="${cliente}" method="post">
      <input type="hidden" th:field="*{id}" />
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

      <div class="form-group">
        <label for="nome">Nome</label>
        <input type="text" id="nome" th:field="*{nome}" class="form-control"
               placeholder="Nome completo" />
        <span class="text-danger" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>
      </div>

      <div class="form-group">
        <label for="cadastroPenitenciaria">Cadastro na Penitenciária</label>
        <input type="text" id="cadastroPenitenciaria" th:field="*{cadastroPenitenciaria}" class="form-control"
               placeholder="Número/código do cadastro do familiar" />
        <span class="text-danger" th:if="${#fields.hasErrors('cadastroPenitenciaria')}" th:errors="*{cadastroPenitenciaria}"></span>
      </div>

      <div class="form-group">
        <label for="telefone">Telefone</label>
        <input type="text" id="telefone" th:field="*{telefone}" class="form-control"
               placeholder="(00) 00000-0000" />
        <span class="text-danger" th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}"></span>
      </div>

      <div style="display:flex; gap:10px; margin-top:8px;">
        <button type="submit" class="btn btn-primary">Salvar</button>
        <a th:href="@{/cliente}" class="btn btn-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>

<footer th:replace="~{fragments/footer :: footer()}"></footer>
</body>
</html>
