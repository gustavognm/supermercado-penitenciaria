<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Usuário')}"></head>
<body>
<nav th:replace="~{fragments/head :: header()}"></nav>

<div class="container">
  <div class="card" style="max-width: 560px; margin: 0 auto;">
    <h2 class="page-title" style="margin-top:0"
        th:text="${usuario.id != null} ? 'Editar Usuário' : 'Novo Usuário'"></h2>

    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <form th:action="@{/usuario/save}" th:object="${usuario}" method="post">
      <input type="hidden" th:field="*{id}" />
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

      <div class="form-group">
        <label for="nome">Nome</label>
        <input type="text" id="nome" th:field="*{nome}" class="form-control"
               placeholder="Nome completo" />
        <span class="text-danger" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>
      </div>

      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" th:field="*{email}" class="form-control"
               placeholder="email@exemplo.com" />
        <span class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
      </div>

      <div class="form-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" class="form-control"
               th:placeholder="${usuario.id != null} ? 'Deixe em branco para manter a senha atual' : 'Senha do usuário'" />
      </div>

      <div class="form-group">
        <label for="perfil">Perfil de Acesso</label>
        <select id="perfil" th:field="*{perfil}" class="form-control">
          <option value="">-- Selecione --</option>
          <option th:each="p : ${perfis}" th:value="${p}" th:text="${p.label}"></option>
        </select>
        <span class="text-danger" th:if="${#fields.hasErrors('perfil')}" th:errors="*{perfil}"></span>
      </div>

      <div style="display:flex; gap:10px; margin-top:8px;">
        <button type="submit" class="btn btn-primary">Salvar</button>
        <a th:href="@{/usuario}" class="btn btn-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>

<footer th:replace="~{fragments/footer :: footer()}"></footer>
</body>
</html>
