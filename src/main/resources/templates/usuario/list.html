<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Usuários')}"></head>
<body>
<nav th:replace="~{fragments/head :: header()}"></nav>

<div class="container">
  <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>
  <div class="table-card">
    <div class="table-header">
      <span class="table-title">Usuários</span>
      <a th:href="@{/usuario/create}" class="btn btn-primary btn-sm">+ Novo Usuário</a>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Nome</th>
            <th>E-mail</th>
            <th>Perfil</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="u : ${usuarios}">
            <td th:text="${u.id}"></td>
            <td th:text="${u.nome}"></td>
            <td th:text="${u.email}"></td>
            <td th:text="${u.perfil.label}"></td>
            <td>
              <a th:href="@{/usuario/edit/{id}(id=${u.id})}" class="btn btn-secondary btn-sm">Editar</a>
              <a th:href="@{/usuario/delete/{id}(id=${u.id})}" class="btn btn-danger btn-sm"
                 onclick="return confirm('Excluir este usuário?')">Excluir</a>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(usuarios)}">
            <td colspan="5">
              <div class="empty-state">Nenhum usuário cadastrado.</div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<footer th:replace="~{fragments/footer :: footer()}"></footer>
</body>
</html>
