spring.application.name=supermercado-penitenciaria

spring.datasource.url=jdbc:mysql://localhost:3306/supermercado_penitenciaria_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# Ensures Hibernate automatically creates or updates the database schema based on your entity mappings.
spring.jpa.hibernate.ddl-auto=update
# Enables logging of SQL queries to the console, useful for debugging.
spring.jpa.show-sql=true
